[package]
name = "kamoku-ui"
description = "Rust-authored journal preview for the local kamoku application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
web-sys = { version = "=0.3.106", features = [
    "Document", "Element", "Event", "EventTarget", "History", "HtmlElement",
    "HtmlInputElement", "HtmlSelectElement", "KeyboardEvent", "Location", "Node",
    "NodeList", "Performance", "Request", "RequestCredentials", "RequestInit",
    "RequestMode", "Response", "UrlSearchParams", "Window",
] }

[lints]
workspace = true
