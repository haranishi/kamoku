[package]
name = "kamoku-ui"
description = "Rust-authored browser UI for the local kamoku application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-normalization = "=0.1.25"
num-bigint = "=0.4.8"
num-traits = "=0.2.19"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
js-sys = "=0.3.106"
web-sys = { version = "=0.3.106", features = [
    "Document", "Element", "Event", "EventTarget", "History", "HtmlElement",
    "HtmlInputElement", "HtmlSelectElement", "KeyboardEvent", "Location", "Node",
    "NodeList", "Performance", "Request", "RequestCredentials", "RequestInit",
    "RequestMode", "Response", "UrlSearchParams", "Window", "Headers",
    "AbortController", "AbortSignal", "Blob", "BlobPropertyBag", "Crypto",
    "CssStyleDeclaration", "DomRect", "DomTokenList", "File", "FileList",
    "FocusEvent", "HtmlButtonElement", "HtmlDialogElement", "HtmlFormElement",
    "HtmlTextAreaElement", "HtmlOptionElement", "HtmlCollection", "InputEvent",
    "MediaQueryList", "MouseEvent", "Navigator", "Storage", "Url", "Clipboard",
    "BeforeUnloadEvent", "ScrollIntoViewOptions", "ScrollLogicalPosition",
    "HtmlAnchorElement", "HtmlTableRowElement", "HtmlTableElement", "DataTransfer",
    "DragEvent", "SubmitEvent", "HtmlDetailsElement", "VisualViewport", "Text",
    "ResizeObserver", "ResizeObserverEntry", "MutationObserver", "MutationObserverInit",
] }

[lints]
workspace = true
