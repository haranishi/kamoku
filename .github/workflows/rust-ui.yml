# Build the production Rust UI once; callers embed the exact generated assets.
name: rust-ui

on:
  workflow_call:

permissions:
  contents: read

jobs:
  wasm-browser:
    name: Rust UI (WASM, Rust 1.88)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup target add wasm32-unknown-unknown
      - run: rustup toolchain install 1.88 --profile minimal --target wasm32-unknown-unknown
      - run: cargo +1.88 check -p kamoku-ui --target wasm32-unknown-unknown --locked
      - run: cargo clippy -p kamoku-ui --target wasm32-unknown-unknown --locked -- -D warnings
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: bash tools/build-rust-ui.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-ui-assets
          if-no-files-found: error
          retention-days: 3
          path: |
            ui/rust/pkg/kamoku_ui.js
            ui/rust/pkg/kamoku_ui_bg.wasm
