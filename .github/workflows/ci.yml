# 使うActionsは、タグでなくコミットのハッシュで固定している（乗っ取りへの備え）。
# 更新はDependabotが、ハッシュとバージョンのコメントをまとめて直すPRを出す。

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-ui:
    name: Rust UIの生成と検査
    uses: ./.github/workflows/rust-ui.yml

  test:
    needs: rust-ui
    name: 試験 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-ui-assets
          path: ui/rust/pkg
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    needs: rust-ui
    name: 最小のRustバージョン (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-ui-assets
          path: ui/rust/pkg
      - run: rustup toolchain install 1.88 --profile minimal
      - run: cargo +1.88 check --workspace --locked

  deny:
    name: 依存のライセンスと脆弱性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  reuse:
    name: ライセンス表示 (REUSE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  docs:
    name: 文書のリンクと、台帳の固定値の別計算
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 tools/check-links.py
      - run: python3 tools/verify-ledger-golden.py
      - run: python3 tools/check-spec-trace.py --strict
      - run: python3 -m unittest discover -s tools/tests -v

  ui:
    name: 画面の静的検査と検査器の試験
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node --test ui/tests/
      - run: node ui/dev/check-contrast.mjs
      - run: node ui/dev/check-policy.mjs

  e2e:
    needs: rust-ui
    name: 本物のサーバーでの通し試験（ブラウザ）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-ui-assets
          path: ui/rust/pkg
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      # ローカルと同じ入口で、ビルド・スモーク・操作・契約・撮影まで通す。
      - run: cargo build -p kamoku-app --bin kamoku --locked --message-format=json-render-diagnostics > "$RUNNER_TEMP/kamoku-build.jsonl"
      - run: KAMOKU_BIN="$(python3 ../tools/cargo-executable.py "$RUNNER_TEMP/kamoku-build.jsonl")" ./run-real.sh
        working-directory: e2e
      - run: python3 tools/test-rust-ui.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success()
        with:
          name: rust-ui-synthetic-screens-and-metrics
          if-no-files-found: error
          path: |
            e2e/rust-ui-results/journal-390.png
            e2e/rust-ui-results/journal-768.png
            e2e/rust-ui-results/journal-1440.png
            e2e/rust-ui-results/metrics.json

  secrets:
    name: 秘密情報と実データの走査
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
