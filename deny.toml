# 依存ライブラリのライセンスと脆弱性を検査する設定（cargo-deny）。
# 方針は docs/legal/license-policy.md。コードに入れてよい依存は、
# 下の許可リストにあるライセンスのものだけ。

[graph]
all-features = true

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]
confidence-threshold = 0.93
# 許可リストのうち、今は使われていないライセンスについて警告を出さない。
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
