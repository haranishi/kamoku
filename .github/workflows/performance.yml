name: performance

on:
  pull_request:
    paths:
      - 'crates/kamoku-store/**'
      - 'crates/kamoku-app/**'
      - 'tools/bench-draft-queries.py'
      - '.github/workflows/performance.yml'

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pending-drafts:
    name: 未確認明細の性能比較 (release)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          persist-credentials: false
      - name: Build both revisions with the same toolchain and flags
        run: |
          export CARGO_TARGET_DIR="$RUNNER_TEMP/kamoku-performance-target"
          mkdir -p results
          rustc -Vv > results/toolchain.txt
          printf 'base=%s\nhead=%s\n' "$BASE_SHA" "$HEAD_SHA" > results/revisions.txt
          cargo build --release --locked -p kamoku-app --bin kamoku --manifest-path base/Cargo.toml
          cp "$CARGO_TARGET_DIR/release/kamoku" "$RUNNER_TEMP/kamoku-base"
          cargo build --release --locked -p kamoku-app --bin kamoku --manifest-path head/Cargo.toml
          cp "$CARGO_TARGET_DIR/release/kamoku" "$RUNNER_TEMP/kamoku-head"
      - name: Compare synthetic 10k and 100k pending rows
        run: |
          for rows in 10000 100000; do
            python3 head/tools/bench-draft-queries.py --binary "$RUNNER_TEMP/kamoku-base" --rows "$rows" --samples 10 --timeout 5 --output "results/base-$rows.json"
            python3 head/tools/bench-draft-queries.py --binary "$RUNNER_TEMP/kamoku-head" --rows "$rows" --samples 10 --timeout 5 --require-complete --output "results/head-$rows.json"
          done
      - name: Verify the retained amount guard with a mutation
        working-directory: head
        run: python3 tools/mutate.py tools/mutations/app.json --only 'B5 ホーム'
      - name: Preserve measurements without databases or server logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pending-drafts-performance
          path: results/
          if-no-files-found: error
          retention-days: 14
