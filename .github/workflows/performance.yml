name: performance

on:
  pull_request:
    paths:
      - 'crates/kamoku-store/**'
      - 'crates/kamoku-app/**'
      - 'crates/kamoku-ui/**'
      - 'ui/**'
      - 'e2e/ui-performance.mjs'
      - 'tools/bench-draft-queries.py'
      - 'tools/bench-ui.py'
      - '.github/workflows/performance.yml'

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pending-drafts:
    name: API・画面の性能比較 (release)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Generate each revision's Rust UI before embedding
        run: |
          (cd base && CARGO_TARGET_DIR="$RUNNER_TEMP/kamoku-ui-base" bash tools/build-rust-ui.sh)
          (cd head && CARGO_TARGET_DIR="$RUNNER_TEMP/kamoku-ui-head" bash tools/build-rust-ui.sh)
      - name: Build both revisions with the same toolchain and flags
        run: |
          mkdir -p results
          rustc -Vv > results/toolchain.txt
          printf 'base=%s\nhead=%s\n' "$BASE_SHA" "$HEAD_SHA" > results/revisions.txt
          cargo build --release --locked -p kamoku-app --bin kamoku --manifest-path base/Cargo.toml --target-dir "$RUNNER_TEMP/kamoku-performance-base"
          cp "$RUNNER_TEMP/kamoku-performance-base/release/kamoku" "$RUNNER_TEMP/kamoku-base"
          cargo build --release --locked -p kamoku-app --bin kamoku --manifest-path head/Cargo.toml --target-dir "$RUNNER_TEMP/kamoku-performance-head"
          cp "$RUNNER_TEMP/kamoku-performance-head/release/kamoku" "$RUNNER_TEMP/kamoku-head"
      - name: Compare synthetic 10k and 100k pending rows
        run: |
          for rows in 10000 100000; do
            python3 head/tools/bench-draft-queries.py --binary "$RUNNER_TEMP/kamoku-base" --rows "$rows" --samples 10 --timeout 5 --output "results/base-$rows.json"
            python3 head/tools/bench-draft-queries.py --binary "$RUNNER_TEMP/kamoku-head" --rows "$rows" --samples 10 --timeout 5 --require-complete --output "results/head-$rows.json"
          done
      - name: Verify the retained amount guard with a mutation
        working-directory: head
        run: python3 tools/mutate.py tools/mutations/app.json --only 'B5 ホーム'
      - run: npm ci
        working-directory: head/e2e
      - run: npx playwright install --with-deps chromium
        working-directory: head/e2e
      - name: Compare embedded production UI with identical synthetic fixtures
        run: |
          python3 head/tools/bench-ui.py \
            --baseline "$RUNNER_TEMP/kamoku-base" --head "$RUNNER_TEMP/kamoku-head" \
            --baseline-ref "$BASE_SHA" --head-ref "$HEAD_SHA" \
            --work-dir "$RUNNER_TEMP" --samples 10 --input-samples 20 \
            --output results/ui.json
      - name: Preserve measurements without databases or server logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pending-drafts-performance
          path: results/
          if-no-files-found: error
          retention-days: 14
